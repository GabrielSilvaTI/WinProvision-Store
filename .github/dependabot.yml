version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: nuget
    directories:
      - /WinProvision.Store
      - /src/WinProvision.Core
      - /src/WinProvision.Indexer
      - /tests/WinProvision.Core.IntegrationTests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /scripts/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

