name: Update App Icons CDN

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Setup .NET SDK (.NET 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Locate and Build Extrator C#
        run: |
          PROJ_PATH=$(find main-repo -iname "WingetIconExtractor.csproj" -print -quit)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::Project WingetIconExtractor.csproj was not found in repository!"
            exit 1
          fi
          echo "Found project at: $PROJ_PATH"
          echo "PROJ_PATH=$PROJ_PATH" >> $GITHUB_ENV
          dotnet build "$PROJ_PATH" -c Release

      - name: Execute Icon Pipeline
        run: |
          mkdir -p temp_icons
          dotnet run --project "$ENV:PROJ_PATH" -c Release -- --outdir temp_icons

      - name: Deploy to Icons CDN Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone repository into a temporary folder to manage the orphan branch
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git icons-branch-dir
          cd icons-branch-dir
          
          # Switch to 'icons' branch, or create it as an orphan branch if it doesn't exist
          git checkout icons 2>/dev/null || git checkout --orphan icons
          
          # Clean untracked/old files to prevent stale icon accumulation
          git rm -rf . --ignore-unmatch 2>/dev/null || true
          
          # Copy newly extracted .webp icons and icons.json to branch root
          cp -r ../temp_icons/* .
          
          # Stage and commit changes
          git add .
          git commit -m "chore: cdn updated automatically $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin icons --force
