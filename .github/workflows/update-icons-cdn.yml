name: Update App Icons CDN

on:
  schedule:
    - cron: '0 3 * * 1' # Executa toda segunda-feira às 03:00 AM UTC
  workflow_dispatch: # Permite disparo manual via botão na interface do GitHub

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código Principal
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Setup .NET SDK (.NET 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Compilar Extrator C#
        run: dotnet build main-repo/src/WingetIconExtractor/WingetIconExtractor.csproj -c Release

      - name: Executar Pipeline de Ícones
        run: |
          mkdir temp_icons
          dotnet run --project main-repo/src/WingetIconExtractor/WingetIconExtractor.csproj -c Release -- --outdir temp_icons

      - name: Deploy para a Branch de Ícones (CDN)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clona o repositório em uma pasta separada para gerenciar a branch órfã
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git icons-branch-dir
          cd icons-branch-dir
          
          # Verifica se a branch 'icons' existe, se não, cria como órfã
          git checkout icons 2>/dev/null || git checkout --orphan icons
          
          # Limpa rastreamentos antigos para renovação do catálogo
          git rm -rf . --ignore-unmatch 2>/dev/null || true
          
          # Copia os novos ícones em WebP e o icons.json para a raiz da branch
          cp -r ../temp_icons/* .
          
          # Sincroniza e faz a publicação
          git add .
          git commit -m "chore: cdn atualizada automaticamente $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin icons --force
