name: "Manutenção | Atualizar GetHelpCmd no R2"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-gethelpcmd
  cancel-in-progress: false

jobs:
  update-gethelpcmd:
    # Só usa cmdlets de PowerShell cross-platform (Invoke-WebRequest, Expand-Archive,
    # Compress-Archive) e o AWS CLI, que já vem na imagem — não precisa de Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar e extrair GetHelpCmd
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET || 'winprovision' }}
        run: |
          $destinationDir = "$env:RUNNER_TEMP/GetHelp"
          $zipPath = Join-Path -Path $destinationDir -ChildPath "GetHelp.zip"
          $downloadUrl = "https://aka.ms/SaRA_EnterpriseVersionFiles"

          $sourceEtag = $null
          try {
            $headResponse = Invoke-WebRequest -Uri $downloadUrl -Method Head -MaximumRedirection 5 -UseBasicParsing
            $sourceEtag = ([string]$headResponse.Headers['ETag']).Trim().Trim('"')
          } catch {
            Write-Warning "Não foi possível consultar o ETag do GetHelpCmd; seguirei com a verificação completa."
          }
          if ($sourceEtag) {
            $remote = aws s3api head-object --bucket $env:R2_BUCKET --key Office/Uninstall/GetHelpCmd.zip `
              --endpoint-url $env:R2_ENDPOINT --region auto --output json 2>$null
            if ($LASTEXITCODE -eq 0) {
              $publishedEtag = ($remote | ConvertFrom-Json).Metadata.'source-etag'
              if ($publishedEtag -eq $sourceEtag) {
                "GETHELPCMD_UNCHANGED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                Write-Host "GetHelpCmd sem alterações (ETag $sourceEtag); download, extração e upload ignorados."
                exit 0
              }
            }
            "GETHELPCMD_SOURCE_ETAG=$sourceEtag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -MaximumRedirection 5
          if ((Get-Item $zipPath).Length -lt 1MB) {
            throw "O download do GetHelpCmd está vazio ou incompleto."
          }
          Expand-Archive -Path $zipPath -DestinationPath $destinationDir -Force
          Remove-Item -Path $zipPath -Force

      - name: Localizar GetHelpCmd.exe e reempacotar
        if: env.GETHELPCMD_UNCHANGED != 'true'
        shell: pwsh
        run: |
          $destinationDir = "$env:RUNNER_TEMP/GetHelp"
          $exe = Get-ChildItem -Path $destinationDir -Filter "GetHelpCmd.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exe) {
            Write-Error "GetHelpCmd.exe não encontrado após extração."
            exit 1
          }
          if ($exe.Length -lt 1MB) {
            throw "GetHelpCmd.exe parece incompleto (menos de 1 MB)."
          }

          $toolFolder = $exe.DirectoryName
          Compress-Archive -Path "$toolFolder/*" -DestinationPath "$destinationDir/GetHelpCmd.zip" -Force

      - name: Enviar GetHelpCmd.zip ao Cloudflare R2
        if: env.GETHELPCMD_UNCHANGED != 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET || 'winprovision' }}
        run: |
          $zipPath = "$env:RUNNER_TEMP/GetHelp/GetHelpCmd.zip"
          if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 1MB) {
            throw "GetHelpCmd.zip não foi criado corretamente."
          }
          $awsArgs = @('s3', 'cp', $zipPath, "s3://$env:R2_BUCKET/Office/Uninstall/GetHelpCmd.zip", '--endpoint-url', $env:R2_ENDPOINT, '--region', 'auto')
          if ($env:GETHELPCMD_SOURCE_ETAG) { $awsArgs += @('--metadata', "source-etag=$env:GETHELPCMD_SOURCE_ETAG") }
          aws @awsArgs
