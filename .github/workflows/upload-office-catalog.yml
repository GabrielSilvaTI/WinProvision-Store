name: Publicar catálogo Office no R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/office/catalog.json"
      - "scripts/database/validate_office_catalog.py"
      - "scripts/database/sync_office_assets.py"
      - "scripts/database/r2_download.py"
      - "scripts/database/r2_upload.py"
      - "scripts/requirements/base.txt"
      - "scripts/requirements/msstore.txt"
      - ".github/workflows/upload-office-catalog.yml"

permissions:
  contents: read

concurrency:
  group: office-catalog-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET || 'winprovision' }}
      R2_PUBLIC_BASE: https://pub-166b41912a994dbe86583ba10596d673.r2.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de sincronização
        run: python -m pip install -r scripts/requirements/msstore.txt
      - name: Restaurar mapa de assets Office
        run: |
          python scripts/database/r2_download.py \
            Office/Database/office-assets-map.json \
            "${{ github.workspace }}/office-output/office-assets-map.json"
      - name: Buscar e armazenar mídia no R2
        run: |
          python scripts/database/sync_office_assets.py \
            data/office/catalog.json \
            --map "${{ github.workspace }}/office-output/office-assets-map.json" \
            --public-base "$R2_PUBLIC_BASE" \
            --market BR \
            --language pt-BR
      - name: Validar catálogo e links de mídia
        run: python scripts/database/validate_office_catalog.py data/office/catalog.json
      - name: Publicar mapa de assets no Cloudflare R2
        run: python scripts/database/r2_upload.py "${{ github.workspace }}/office-output/office-assets-map.json" Office/Database/office-assets-map.json
      - name: Publicar catálogo Office no Cloudflare R2
        run: python scripts/database/r2_upload.py data/office/catalog.json Office/Database/catalog.json
