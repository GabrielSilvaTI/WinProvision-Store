name: "Segurança | CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / C#, JavaScript e Python
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar .NET 10 para análise compilada
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript, python
          queries: security-extended

      - name: Compilar C# para análise
        uses: github/codeql-action/autobuild@v4

      - name: Analisar e publicar alertas
        uses: github/codeql-action/analyze@v4
