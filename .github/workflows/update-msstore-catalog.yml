name: Update msstore-catalog.json (Microsoft Store -> R2)

on:
  schedule:
    - cron: "0 7 * * 0" # ~04h Brasília (UTC-3), semanal — a lista curada muda raramente
  workflow_dispatch: {}
  push:
    paths:
      - "src/WinProvision.Indexer/config/msstore-curated.json"

permissions:
  contents: read

concurrency:
  group: msstore-catalog-sync
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET || 'winprovision' }}

    steps:
      - name: Checkout deste repositório (main)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Sem packages.lock.json no repo, então cacheia por hash dos .csproj em vez de
      # usar o cache nativo do setup-dotnet (que exige lock file).
      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar boto3
        run: python -m pip install boto3

      - name: Rodar o Indexer em modo --msstore
        run: >
          dotnet run --project src/WinProvision.Indexer -c Release --
          --msstore
          "${{ github.workspace }}/msstore-output"

      - name: Publicar msstore-catalog.json no R2
        run: >
          python scripts/database/r2_upload.py
          "${{ github.workspace }}/msstore-output/msstore-catalog.json"
          Store/Database/msstore-catalog.json
