name: Lint

# Confere o estilo do C# (dotnet format), do Python (ruff) e dos workflows
# (actionlint). Só lê o repositório, não publica nada.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: C# (dotnet format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # --folder trata a pasta como simples arquivos .cs: não carrega os projetos
      # WPF, então roda no Linux e sem restore. Confere só o que o .editorconfig
      # define de espaços, chaves, charset e ordem dos usings.
      - name: Verificar formatação
        run: dotnet format whitespace . --folder --verify-no-changes --verbosity normal

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          src: scripts

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          src: scripts
          args: "format --check --diff"

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rodar actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.11 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
