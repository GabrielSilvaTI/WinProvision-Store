version: 2.1

jobs:
  sync-apps-json:
    docker:
      # Não existe convenience image oficial cimg/dotnet na CircleCI (só um pedido em
      # aberto na comunidade deles) — usa a imagem oficial da Microsoft. Roda como root,
      # por isso os comandos abaixo não usam sudo.
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: medium
    steps:
      - run:
          name: Instalar git (a imagem do .NET não vem com git)
          command: |
            apt-get update -y
            apt-get install -y git ca-certificates

      - run:
          name: Checkout via HTTPS com GH_TOKEN (o checkout embutido do CircleCI usa SSH e este projeto não tem deploy key SSH configurada)
          command: |
            git clone --no-checkout \
              https://x-access-token:${GH_TOKEN}@github.com/GabrielSilvaTI/WinProvision-Store.git .
            git checkout "$CIRCLE_SHA1"

      - run:
          name: Instalar Python e boto3 (a imagem do .NET não vem com Python)
          command: |
            apt-get install -y python3 python3-pip
            pip3 install --break-system-packages boto3

      - run:
          name: Checkout esparso do winget-pkgs (só a pasta manifests)
          # O "sparse-checkout set" baixa e grava ~700 mil arquivos de manifest SEM imprimir nada
          # durante minutos; o padrão do CircleCI mata o passo após 10 min sem saída.
          no_output_timeout: 45m
          command: |
            git clone --depth 1 --filter=blob:none --sparse \
              https://x-access-token:${GH_TOKEN}@github.com/microsoft/winget-pkgs.git \
              winget-pkgs
            cd winget-pkgs

            # Heartbeat: imprime uma linha por minuto enquanto o git trabalha em silêncio.
            ( while true; do sleep 60; echo "  ... ainda baixando/gravando os manifests"; done ) &
            HEARTBEAT_PID=$!
            git sparse-checkout set manifests
            kill $HEARTBEAT_PID
            echo "Manifests baixados: $(find manifests -name '*.yaml' | wc -l) arquivos .yaml"

      - run:
          name: Restaurar metrics-cache.json do R2 (se existir)
          command: |
            mkdir -p catalog-output
            python3 scripts/database/r2_download.py \
              Store/Database/metrics-cache.json \
              "$(pwd)/catalog-output/metrics-cache.json"

      - run:
          name: Restaurar apps.json anterior do R2 (reaproveitar tamanhos de instalador)
          command: |
            python3 scripts/database/r2_download.py \
              Store/Database/apps.json \
              "$(pwd)/catalog-output/apps.previous.json"

      - run:
          name: Restaurar estado de hashes da API anterior do R2 (comparar por pacote)
          command: |
            mkdir -p catalog-output/api-previous
            python3 scripts/database/r2_download.py \
              Store/Api/v1/_state/package-hashes.json \
              "$(pwd)/catalog-output/api-previous/package-hashes.json"

      - run:
          name: Rodar o Indexer
          no_output_timeout: 30m
          # GITHUB_TOKEN é lido pelo próprio Indexer (métricas de estrelas etc.) — reaproveita
          # a variável GH_TOKEN cadastrada no projeto. Precisa ser exportada aqui dentro: a chave
          # "environment:" do CircleCI NÃO expande "$GH_TOKEN" (o Indexer recebia o texto literal).
          command: |
            export GITHUB_TOKEN="$GH_TOKEN"
            dotnet run --project src/WinProvision.Indexer -c Release -- \
              "$(pwd)/winget-pkgs/manifests" \
              "$(pwd)/catalog-output"

      - run:
          name: Publicar apps.json no R2
          command: |
            export APPS_JSON_SOURCE="$(pwd)/catalog-output/apps.json"
            export PREVIOUS_APPS_JSON_URL="https://pub-166b41912a994dbe86583ba10596d673.r2.dev/Store/Database/apps.json"
            python3 scripts/database/upload_apps_json.py

      - run:
          # O Indexer (passo [8/8], InstallerApiExporter) grava catalog-output/api/index.json
          # e catalog-output/api/packages/*.json; nenhum argumento novo no dotnet run.
          name: Publicar API no R2 (só pacotes com hash alterado)
          command: |
            python3 scripts/database/upload_api_json.py \
              "$(pwd)/catalog-output/api" \
              "$(pwd)/catalog-output/api-previous/package-hashes.json" \
              Store/Api/v1

      - run:
          name: Devolver metrics-cache.json atualizado pro R2
          when: always
          command: |
            python3 scripts/database/r2_upload.py \
              "$(pwd)/catalog-output/metrics-cache.json" \
              Store/Database/metrics-cache.json

  sync-icons:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Instalar dependências
          command: pip install boto3 pymszip pyyaml pillow

      - run:
          name: Sincronizar ícones (CDN winget -> R2)
          # ICON_SYNC_LIVE precisa ser criada nas variáveis de ambiente do projeto,
          # no CircleCI, para sair do modo simulação. Sem ela, roda em dry-run.
          command: |
            args=(--out sync-out --max-probes 0 --recheck-days 30)
            if [ "$ICON_SYNC_LIVE" != "true" ]; then
              args+=(--dry-run)
            fi
            python scripts/icons/sync_cdn_icons.py "${args[@]}"

      - store_artifacts:
          path: sync-out
          destination: icon-sync

      - run:
          name: Disparar o sync-icon-manifest.yml no GitHub (só se algo foi enviado)
          when: on_success
          command: |
            uploaded=$(python3 -c "import json; print(json.load(open('sync-out/report.json'))['status'].get('ok', 0))" 2>/dev/null || echo 0)
            if [ "$ICON_SYNC_LIVE" != "true" ] || [ "$uploaded" = "0" ]; then
              echo "Simulação ou nenhum ícone novo ($uploaded), não disparo o sync do manifesto."
              exit 0
            fi
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/GabrielSilvaTI/WinProvision-Store/actions/workflows/sync-icon-manifest.yml/dispatches \
              -d '{"ref":"main"}')
            if [ "$status" != "204" ]; then
              echo "Aviso: disparo do sync-icon-manifest.yml falhou (HTTP $status). O agendamento das 07:00 UTC publica o manifest no dia seguinte."
            fi

workflows:
  winget-sync:
    # SEM este "when", o CircleCI dispara o workflow em TODO push de qualquer branch — e este job
    # é pesado (clona o winget-pkgs e roda o Indexer). Agora só roda:
    #   - pelo agendamento (Project Settings > Triggers, ex.: diário 06:00 UTC), ou
    #   - manualmente (botão "Trigger Pipeline" / API).
    when:
      or:
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - equal: [api, << pipeline.trigger_source >>]
    jobs:
      - sync-apps-json
      - sync-icons:
          requires:
            - sync-apps-json
