version: 2.1

parameters:
  run_msstore_catalog:
    type: boolean
    default: false

jobs:
  sync_msstore_catalog:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: medium
    environment:
      R2_PUBLIC_BASE: https://pub-166b41912a994dbe86583ba10596d673.r2.dev
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "scripts/requirements/msstore.txt" }}
      - run:
          name: Preparar Python e .NET 10
          command: |
            python3 -m venv /tmp/ci-venv
            /tmp/ci-venv/bin/pip install --disable-pip-version-check -r scripts/requirements/msstore.txt
            curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /home/circleci/.dotnet
            echo 'export DOTNET_ROOT=/home/circleci/.dotnet' >> "$BASH_ENV"
            echo 'export PATH=/home/circleci/.dotnet:$PATH' >> "$BASH_ENV"
      - save_cache:
          key: pip-v1-{{ checksum "scripts/requirements/msstore.txt" }}
          paths:
            - /home/circleci/.cache/pip
      - run:
          name: Restaurar cache de mídia e catálogo anterior do R2
          command: |
            /tmp/ci-venv/bin/python scripts/database/r2_download.py \
              Store/Catalog/msstore/manifest/asset-cache.json \
              "$PWD/msstore-output/msstore-assets-map.json"
            /tmp/ci-venv/bin/python scripts/database/r2_download.py \
              Store/Catalog/msstore/manifest/search-index.json \
              "$PWD/msstore-output/msstore-catalog.previous.json"
      - restore_cache:
          keys:
            - nuget-v1-{{ checksum "src/WinProvision.Indexer/WinProvision.Indexer.csproj" }}-{{ checksum "src/WinProvision.Core/WinProvision.Core.csproj" }}
            - nuget-v1-
      - run:
          name: Gerar catálogo da Microsoft Store
          command: dotnet run --project src/WinProvision.Indexer -c Release -- --msstore "$PWD/msstore-output"
          no_output_timeout: 45m
      - save_cache:
          key: nuget-v1-{{ checksum "src/WinProvision.Indexer/WinProvision.Indexer.csproj" }}-{{ checksum "src/WinProvision.Core/WinProvision.Core.csproj" }}
          paths:
            - /home/circleci/.nuget/packages
      - run:
          name: Validar catálogo da Microsoft Store
          command: |
            /tmp/ci-venv/bin/python scripts/database/validate_catalog.py \
              "$PWD/msstore-output/msstore-catalog.json" \
              --previous "$PWD/msstore-output/msstore-catalog.previous.json" \
              --min-count 20 \
              --min-retention 0.50 \
              --expected-source msstore
      - run:
          name: Organizar imagens da Microsoft Store por aplicativo no R2
          command: |
            /tmp/ci-venv/bin/python scripts/database/sync_msstore_catalog_media.py \
              "$PWD/msstore-output/msstore-catalog.json" \
              --map "$PWD/msstore-output/msstore-assets-map.json" \
              --previous "$PWD/msstore-output/msstore-catalog.previous.json"
      - run:
          name: Montar catálogo hierárquico da Microsoft Store
          command: |
            /tmp/ci-venv/bin/python scripts/database/r2_upload.py \
              "$PWD/msstore-output/msstore-assets-map.json" \
              Store/Catalog/msstore/manifest/asset-cache.json
            /tmp/ci-venv/bin/python scripts/database/build_msstore_catalog.py \
              "$PWD/msstore-output/msstore-catalog.json" \
              "$PWD/msstore-output/catalog"
            MSSTORE_CATALOG_SOURCE="$PWD/msstore-output/catalog" \
              /tmp/ci-venv/bin/python scripts/database/upload_msstore_catalog.py
            /tmp/ci-venv/bin/python scripts/database/build_api_v2.py \
              msstore "$PWD/msstore-output/msstore-catalog.json" "$PWD/msstore-output/api-v2/msstore"
            API_V2_SOURCE=msstore API_V2_SOURCE_DIR="$PWD/msstore-output/api-v2/msstore" \
              /tmp/ci-venv/bin/python scripts/database/upload_api_v2.py

workflows:
  microsoft_store_catalog:
    when: << pipeline.parameters.run_msstore_catalog >>
    jobs:
      - sync_msstore_catalog:
          context: r2-publishing
          filters:
            branches:
              only: main
