version: 2.1

parameters:
  run_icon_manifest:
    type: boolean
    default: false

jobs:
  publish_icon_manifest:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Pipeline legado desativado
          command: echo "Manifesto legado de ícones desativado; os ícones ficam junto aos apps no catálogo V2."

workflows:
  icon_manifest:
    when: << pipeline.parameters.run_icon_manifest >>
    jobs:
      - publish_icon_manifest:
          filters:
            branches:
              only: main
