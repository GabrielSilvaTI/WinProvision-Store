version: 2.1

parameters:
  run_screenshot_index:
    type: boolean
    default: false
  # Compatibilidade com gatilhos existentes. Esses parâmetros agora acionam
  # somente a reindexação de objetos já armazenados; não há rastreamento de sites.
  run_homepage_screenshot_sync:
    type: boolean
    default: false
  run_screenshot_sync:
    type: boolean
    default: false
  homepage_screenshot_batch_size:
    type: integer
    default: 100
  homepage_screenshot_package_id:
    type: string
    default: ""
  homepage_screenshot_url:
    type: string
    default: ""

jobs:
  publish_screenshot_index:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: small
    environment:
      R2_PUBLIC_BASE: https://pub-166b41912a994dbe86583ba10596d673.r2.dev
    steps:
      - checkout
      - run:
          name: Preparar Python para o índice de screenshots
          command: |
            python3 -m venv /tmp/ci-venv
            /tmp/ci-venv/bin/pip install --disable-pip-version-check -r scripts/requirements/base.txt
      - run:
          name: Preparar a pasta do índice
          command: mkdir -p screenshot-index-output
      - run:
          name: Indexar somente screenshots já armazenadas no R2
          command: |
            /tmp/ci-venv/bin/python scripts/database/index_r2_screenshots.py \
              screenshot-index-output/screenshot-index.json \
              --report screenshot-index-output/report.json
      - store_artifacts:
          path: screenshot-index-output/report.json
          destination: screenshot-index-report.json
      - run:
          name: Publicar o índice compacto de screenshots
          command: |
            /tmp/ci-venv/bin/python scripts/database/r2_upload.py \
              "$PWD/screenshot-index-output/screenshot-index.json" \
              Store/Database/screenshot-index.json

workflows:
  screenshot_index:
    when:
      or:
        - << pipeline.parameters.run_screenshot_index >>
        - << pipeline.parameters.run_homepage_screenshot_sync >>
        - << pipeline.parameters.run_screenshot_sync >>
    jobs:
      - publish_screenshot_index:
          context: r2-publishing
          filters:
            branches:
              only: main
