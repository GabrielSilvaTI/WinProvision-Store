version: 2.1

parameters:
  run_homepage_screenshot_sync:
    type: boolean
    default: false
  homepage_screenshot_batch_size:
    type: integer
    default: 100

jobs:
  sync_homepage_screenshots:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: medium
    environment:
      R2_PUBLIC_BASE: https://pub-166b41912a994dbe86583ba10596d673.r2.dev
    steps:
      - checkout
      - run:
          name: Instalar dependências
          command: |
            python3 -m venv /tmp/ci-venv
            /tmp/ci-venv/bin/pip install --disable-pip-version-check -r scripts/requirements/screenshots.txt
      - run:
          name: Restaurar catálogo e estado do crawler do R2
          command: |
            mkdir -p homepage-screenshot-output
            /tmp/ci-venv/bin/python scripts/database/r2_download.py \
              Store/Database/apps.json "$PWD/homepage-screenshot-output/apps.json"
            /tmp/ci-venv/bin/python scripts/database/r2_download.py \
              Store/Database/homepage-screenshot-state.json "$PWD/homepage-screenshot-output/state.json"
            test -s homepage-screenshot-output/apps.json || {
              echo "Catálogo Store/Database/apps.json não encontrado no R2."
              exit 1
            }
            cp homepage-screenshot-output/apps.json homepage-screenshot-output/apps.previous.json
      - run:
          name: Procurar e publicar capturas nas páginas oficiais
          command: |
            /tmp/ci-venv/bin/python scripts/database/sync_homepage_screenshots.py \
              homepage-screenshot-output/apps.json homepage-screenshot-output/state.json \
              --report homepage-screenshot-output/report.json \
              --batch-size << pipeline.parameters.homepage_screenshot_batch_size >>
          no_output_timeout: 30m
      - store_artifacts:
          path: homepage-screenshot-output/report.json
          destination: homepage-screenshot-report.json
      - run:
          name: Validar e publicar catálogo e estado
          command: |
            /tmp/ci-venv/bin/python scripts/database/validate_catalog.py \
              homepage-screenshot-output/apps.json \
              --previous homepage-screenshot-output/apps.previous.json \
              --min-count 5000 --min-retention 0.70
            /tmp/ci-venv/bin/python scripts/database/r2_upload.py \
              "$PWD/homepage-screenshot-output/apps.json" Store/Database/apps.json
            /tmp/ci-venv/bin/python scripts/database/r2_upload.py \
              "$PWD/homepage-screenshot-output/state.json" Store/Database/homepage-screenshot-state.json

workflows:
  homepage_screenshots:
    when: << pipeline.parameters.run_homepage_screenshot_sync >>
    jobs:
      - sync_homepage_screenshots:
          context: r2-publishing
          filters:
            branches:
              only: main
