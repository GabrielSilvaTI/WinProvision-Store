version: 2.1

parameters:
  run_screenshot_index:
    type: boolean
    default: false
  # Parâmetros mantidos para que gatilhos antigos terminem sem republicar índices legados.
  run_homepage_screenshot_sync:
    type: boolean
    default: false
  run_screenshot_sync:
    type: boolean
    default: false
  homepage_screenshot_batch_size:
    type: integer
    default: 100
  homepage_screenshot_package_id:
    type: string
    default: ""
  homepage_screenshot_url:
    type: string
    default: ""

jobs:
  publish_screenshot_index:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Pipeline legado desativado
          command: echo "Índice antigo de screenshots desativado; as imagens ficam no catálogo V2."

workflows:
  screenshot_index:
    when:
      or:
        - << pipeline.parameters.run_screenshot_index >>
        - << pipeline.parameters.run_homepage_screenshot_sync >>
        - << pipeline.parameters.run_screenshot_sync >>
    jobs:
      - publish_screenshot_index:
          filters:
            branches:
              only: main
