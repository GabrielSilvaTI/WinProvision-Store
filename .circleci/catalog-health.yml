version: 2.1

parameters:
  run_catalog_health:
    type: boolean
    default: false
  max_media_urls:
    type: integer
    default: 500

jobs:
  check_public_catalog_health:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "scripts/requirements/screenshots.txt" }}
      - run:
          name: Instalar dependências do verificador
          command: |
            python3 -m venv /tmp/ci-venv
            /tmp/ci-venv/bin/pip install --disable-pip-version-check -r scripts/requirements/screenshots.txt
      - save_cache:
          key: pip-v1-{{ checksum "scripts/requirements/screenshots.txt" }}
          paths:
            - /home/circleci/.cache/pip
      - run:
          name: Validar catálogos públicos e links de mídia
          command: |
            /tmp/ci-venv/bin/python scripts/database/catalog_health.py \
              --report-dir catalog-health-report \
              --workers 24 \
              --max-media-urls << pipeline.parameters.max_media_urls >> \
              --max-failure-rate 0.01
          no_output_timeout: 30m
      - when:
          condition: always
          steps:
            - store_artifacts:
                path: catalog-health-report
                destination: catalog-health-report

workflows:
  catalog_health:
    when: << pipeline.parameters.run_catalog_health >>
    jobs:
      - check_public_catalog_health:
          filters:
            branches:
              only: main
