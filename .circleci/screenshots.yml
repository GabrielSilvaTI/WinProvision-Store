version: 2.1

parameters:
  run_screenshot_sync:
    type: boolean
    default: false
  screenshot_batch_size:
    type: integer
    default: 20

jobs:
  capture_catalog_screenshots:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "scripts/requirements/icons.txt" }}-{{ checksum "scripts/requirements/screenshots.txt" }}
      - run:
          name: Instalar dependências de captura de mídia
          command: |
            python3 -m pip install --disable-pip-version-check \
              -r scripts/requirements/icons.txt -r scripts/requirements/screenshots.txt
      - save_cache:
          key: pip-v1-{{ checksum "scripts/requirements/icons.txt" }}-{{ checksum "scripts/requirements/screenshots.txt" }}
          paths:
            - /home/circleci/.cache/pip
      - run:
          name: Encontrar screenshots nas homepages dos apps
          command: |
            python3 scripts/database/catalog_media.py \
              --mode auto --type screenshot \
              --batch-size "<< pipeline.parameters.screenshot_batch_size >>" \
              --out screenshot-media-report.json
          no_output_timeout: 30m
      - store_artifacts:
          path: screenshot-media-report.json
          destination: screenshot-media-report.json

workflows:
  screenshots:
    when: << pipeline.parameters.run_screenshot_sync >>
    jobs:
      - capture_catalog_screenshots:
          context: r2-publishing
          filters:
            branches:
              only: main
