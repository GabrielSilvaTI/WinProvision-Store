version: 2.1

parameters:
  run_catalog_snapshot:
    type: boolean
    default: false
  restore_catalog_snapshot:
    type: boolean
    default: false
  catalog_snapshot_id:
    type: string
    default: ""

jobs:
  snapshot_validated_catalogs:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Snapshots legados desativados
          command: echo "Snapshots legados desativados; os catálogos V2 são publicados em chaves estáveis."

  restore_validated_catalogs:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Restauração legada desativada
          command: echo "Restauração de snapshots legados desativada."

workflows:
  catalog_snapshot:
    when:
      and:
        - << pipeline.parameters.run_catalog_snapshot >>
        - not: << pipeline.parameters.restore_catalog_snapshot >>
    jobs:
      - snapshot_validated_catalogs:
          filters:
            branches:
              only: main
  catalog_restore:
    when:
      and:
        - << pipeline.parameters.restore_catalog_snapshot >>
        - not: << pipeline.parameters.run_catalog_snapshot >>
    jobs:
      - restore_validated_catalogs:
          filters:
            branches:
              only: main
