version: 2.1

parameters:
  run_icon_sync:
    type: boolean
    default: false
  publish_icons:
    type: boolean
    default: false

jobs:
  sync_icons:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "scripts/requirements/icons.txt" }}-{{ checksum "scripts/requirements/screenshots.txt" }}
      - run:
          name: Instalar dependências de captura de mídia
          command: |
            python3 -m pip install --disable-pip-version-check \
              -r scripts/requirements/icons.txt -r scripts/requirements/screenshots.txt
      - save_cache:
          key: pip-v1-{{ checksum "scripts/requirements/icons.txt" }}-{{ checksum "scripts/requirements/screenshots.txt" }}
          paths:
            - /home/circleci/.cache/pip
      - run:
          name: Capturar ícones do WinGet e associar aos apps
          command: |
            args=(--mode auto --type icon --batch-size 100 --out sync-out/catalog-media-report.json)
            if [ "<< pipeline.parameters.publish_icons >>" != "true" ]; then
              args+=(--dry-run)
            fi
            python3 scripts/database/catalog_media.py "${args[@]}"
          no_output_timeout: 30m
      - store_artifacts:
          path: sync-out
          destination: icon-sync


workflows:
  icon_sync:
    when: << pipeline.parameters.run_icon_sync >>
    jobs:
      - sync_icons:
          context: r2-publishing
          filters:
            branches:
              only: main
